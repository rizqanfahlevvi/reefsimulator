name: Uji otomatis

# Deploy ditangani Vercel (lihat vercel.json). Workflow ini hanya menjaga kualitas:
# uji regresi fisika + CFD dan memastikan build berhasil di setiap push dan PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
